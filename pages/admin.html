<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - EnglishCheck</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Админ-панель</h1>
            <a href="../index.html" class="btn btn-outline">На главную</a>
        </header>

        <div id="login-section" class="login-section">
            <form id="login-form" class="login-form">
                <h2>Вход</h2>
                <input type="password" id="admin-password" placeholder="Пароль" required>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </div>

        <main id="admin-content" class="admin-content hidden">
            <section class="stats-section">
                <div class="stat-card">
                    <h3>Всего тестов</h3>
                    <p id="total-tests" class="stat-value">0</p>
                </div>
                <div class="stat-card">
                    <h3>Средний балл</h3>
                    <p id="avg-score" class="stat-value">0%</p>
                </div>
                <div class="stat-card">
                    <h3>Сегодня</h3>
                    <p id="today-tests" class="stat-value">0</p>
                </div>
            </section>

            <section class="filters-section">
                <div class="filters">
                    <select id="test-filter" class="filter-select">
                        <option value="">Все тесты</option>
                    </select>
                    <input type="date" id="date-filter" class="filter-input">
                    <button id="reset-filters" class="btn btn-outline">Сбросить</button>
                    <button id="export-csv" class="btn btn-secondary">Экспорт CSV</button>
                </div>
            </section>

            <section class="table-section">
                <table id="results-table" class="results-table">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Тест</th>
                            <th>Результат</th>
                            <th>Дата</th>
                            <th>Время</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody">
                        <!-- Данные загружаются через JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="../js/admin.js"></script>
</body>
</html>
